@if (!nav.isAdmin()) {
  <header class="hdr">
    <a class="logo" routerLink="/tienda">MercadoYa</a>
    <input class="search" type="search" placeholder="Buscar productos" aria-label="Buscar productos" autocomplete="off"
      [value]="term()" (input)="onInput($any($event.target).value)" (keydown.enter)="search()" />
    <a class="btn" routerLink="/tienda/carrito">Carrito ({{ cart.count() }})</a>
    @if (auth.authenticated()) {
      <span class="who">{{ auth.email() || auth.username() }}</span>
      @if (auth.isAdmin()) {
        <a class="btn o" routerLink="/admin">Panel admin</a>
      }
      <button class="btn o" type="button" (click)="auth.logout()">Salir</button>
    } @else {
      <button class="btn o" type="button" (click)="auth.login()">Ingresar</button>
    }
  </header>
}
<main [class.adm-main]="nav.isAdmin()">
  <router-outlet />
</main>
