<header class="hdr">
  <a class="logo" routerLink="/tienda">MercadoYa</a>
  <span class="grow"></span>
  <a class="btn" routerLink="/tienda/carrito">Carrito ({{ cart.count() }})</a>
  @if (auth.authenticated()) {
    <span class="who">{{ auth.username() }}</span>
    @if (auth.isAdmin()) {
      <a class="btn o" routerLink="/admin">Panel admin</a>
    }
    <button class="btn o" type="button" (click)="auth.logout()">Salir</button>
  } @else {
    <button class="btn o" type="button" (click)="auth.login()">Ingresar</button>
  }
</header>
<main>
  <router-outlet />
</main>
