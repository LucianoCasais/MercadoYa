server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Archivos con hash en el nombre: se pueden cachear para siempre.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Rutas de Angular (/tienda, /admin, /pedido/...): cualquier ruta que no sea un archivo devuelve index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
