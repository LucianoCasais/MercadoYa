server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Comprimir JS, CSS y JSON: el JS principal pasa de ~280 KB a ~80 KB (pesa en redes lentas; indicador del acta < 3 s).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

  # Archivos con hash en el nombre: se pueden cachear para siempre.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Rutas de Angular (/tienda, /admin, /pedido/...): cualquier ruta que no sea un archivo devuelve index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
