<rect x="250" y="20" width="240" height="110" rx="12" fill="#f7f7f5" stroke="#c9c9c0" stroke-width="1.2"/>
<text x="262" y="39" font-size="12" font-weight="700" fill="#5b5b55">Identidad</text>
