<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 700" width="1150" height="700" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title id="t">MercadoYa: diagrama general de arquitectura</title>
<desc id="d">El usuario accede a la web Angular, que inicia sesión en Keycloak y consume la api .NET con JWT. La api publica OrderRequested en RabbitMQ; el worker lo consume, reserva stock en la api, cobra por gRPC en payments y actualiza el estado del pedido. PostgreSQL guarda la base mercadoya y la base payments.</desc>
