<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 610" width="1150" height="610" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title id="t">MercadoYa: SAGA del checkout con compensaciones</title>
<desc id="d">La api crea el pedido Pendiente y publica OrderRequested. El worker orquesta tres pasos: reserva el stock, cobra por gRPC en payments (punto de no retorno) y confirma el pedido. Si no hay stock el pedido se rechaza por SinStock; si el stock no responde, se libera por si se aplicó y se rechaza por StockNoDisponible; si el pago se rechaza o payments no responde, se libera el stock y se rechaza por PagoFallido o PagoNoDisponible. Si RabbitMQ no confirma la publicación, el pedido se rechaza por BrokerNoDisponible. Al rechazar, primero se deja el pedido Rechazado y después se libera el stock, de forma idempotente.</desc>
<defs>
<marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b36b00"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker>
</defs>
<rect width="1150" height="610" fill="#ffffff"/>
<rect x="20" y="20" width="200" height="130" rx="12" fill="#f7f7f5" stroke="#c9c9c0" stroke-width="1.2"/>
<text x="32" y="39" font-size="12" font-weight="700" fill="#5b5b55">api</text>
<rect x="30" y="50" width="180" height="90" rx="10" fill="#fdecee" stroke="#c8102e" stroke-width="1.5"/>
<text x="120.0" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">1. Crear el pedido</text>
<text x="120.0" y="99.0" text-anchor="middle" font-size="12" fill="#1d1d1b">queda Pendiente y publica</text>
<text x="120.0" y="116.0" text-anchor="middle" font-size="12" fill="#1d1d1b">OrderRequested (202)</text>
<rect x="240" y="20" width="640" height="130" rx="12" fill="#f7f7f5" stroke="#c9c9c0" stroke-width="1.2"/>
<text x="252" y="39" font-size="12" font-weight="700" fill="#5b5b55">worker · orquestador de la SAGA</text>
<rect x="250" y="50" width="180" height="90" rx="10" fill="#fdecee" stroke="#c8102e" stroke-width="1.5"/>
<text x="340.0" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">2. Reservar stock</text>
<text x="340.0" y="99.0" text-anchor="middle" font-size="12" fill="#1d1d1b">atómico e idempotente</text>
<text x="340.0" y="116.0" text-anchor="middle" font-size="12" fill="#1d1d1b">(api, endpoint interno)</text>
<rect x="470" y="50" width="180" height="90" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="1.5"/>
<text x="560.0" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">3. Cobrar</text>
<text x="560.0" y="99.0" text-anchor="middle" font-size="12" fill="#1d1d1b">gRPC a payments (Polly)</text>
<text x="560.0" y="116.0" text-anchor="middle" font-size="12" fill="#1d1d1b">punto de no retorno</text>
<rect x="690" y="50" width="180" height="90" rx="10" fill="#fdecee" stroke="#c8102e" stroke-width="1.5"/>
<text x="780.0" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">4. Confirmar</text>
<text x="780.0" y="99.0" text-anchor="middle" font-size="12" fill="#1d1d1b">UPDATE condicional:</text>
<text x="780.0" y="116.0" text-anchor="middle" font-size="12" fill="#1d1d1b">solo si sigue Pendiente</text>
<rect x="900" y="20" width="230" height="130" rx="12" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="1.2"/>
<text x="912" y="39" font-size="12" font-weight="700" fill="#2e7d4f">Estado final</text>
<rect x="915" y="50" width="200" height="90" rx="10" fill="#e8f5ec" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="1015.0" y="82.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">Confirmado</text>
<text x="1015.0" y="99.0" text-anchor="middle" font-size="12" fill="#1d1d1b">stock descontado</text>
<text x="1015.0" y="116.0" text-anchor="middle" font-size="12" fill="#1d1d1b">y pago aprobado</text>
<path d="M210,95 H250" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#af)"/>
<path d="M430,95 H470" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#af)"/>
<path d="M650,95 H690" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#af)"/>
<path d="M870,95 H915" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#af)"/>
<rect x="20" y="170" width="1110" height="215" rx="12" fill="#f7f7f5" stroke="#c9c9c0" stroke-width="1.2"/>
<text x="32" y="189" font-size="12" font-weight="700" fill="#5b5b55">Si un paso falla: el pedido termina Rechazado con el motivo que indica cada flecha (→)</text>
<rect x="30" y="205" width="180" height="70" rx="10" fill="#fdecee" stroke="#c8102e" stroke-width="1.5"/>
<text x="120.0" y="227.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">RabbitMQ no confirma</text>
<text x="120.0" y="244.0" text-anchor="middle" font-size="12" fill="#1d1d1b">→ BrokerNoDisponible</text>
<text x="120.0" y="261.0" text-anchor="middle" font-size="12" fill="#1d1d1b">503 al cliente</text>
<path d="M120,140 V205" fill="none" stroke="#b36b00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<path d="M340,140 V156 H450 V240 H430" fill="none" stroke="#b36b00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<path d="M450,240 V330 H430" fill="none" stroke="#b36b00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<rect x="250" y="205" width="180" height="70" rx="10" fill="#fdecee" stroke="#c8102e" stroke-width="1.5"/>
<text x="340.0" y="227.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">Sin stock (409)</text>
<text x="340.0" y="244.0" text-anchor="middle" font-size="12" fill="#1d1d1b">→ SinStock</text>
<text x="340.0" y="261.0" text-anchor="middle" font-size="12" fill="#1d1d1b">nada que compensar</text>
<rect x="250" y="295" width="180" height="70" rx="10" fill="#fdecee" stroke="#c8102e" stroke-width="1.5"/>
<text x="340.0" y="317.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">api de stock caída</text>
<text x="340.0" y="334.0" text-anchor="middle" font-size="12" fill="#1d1d1b">libera por si se aplicó</text>
<text x="340.0" y="351.0" text-anchor="middle" font-size="12" fill="#1d1d1b">→ StockNoDisponible</text>
<path d="M560,140 V156 H670 V240 H650" fill="none" stroke="#b36b00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<path d="M670,240 V330 H650" fill="none" stroke="#b36b00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<rect x="470" y="205" width="180" height="70" rx="10" fill="#fdecee" stroke="#c8102e" stroke-width="1.5"/>
<text x="560.0" y="227.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">Pago rechazado</text>
<text x="560.0" y="244.0" text-anchor="middle" font-size="12" fill="#1d1d1b">libera el stock</text>
<text x="560.0" y="261.0" text-anchor="middle" font-size="12" fill="#1d1d1b">→ PagoFallido</text>
<rect x="470" y="295" width="180" height="70" rx="10" fill="#fdecee" stroke="#c8102e" stroke-width="1.5"/>
<text x="560.0" y="317.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">payments caído o lento</text>
<text x="560.0" y="334.0" text-anchor="middle" font-size="12" fill="#1d1d1b">libera el stock</text>
<text x="560.0" y="351.0" text-anchor="middle" font-size="12" fill="#1d1d1b">→ PagoNoDisponible</text>
<path d="M780,140 V205" fill="none" stroke="#b36b00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<rect x="690" y="205" width="180" height="70" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="1.5"/>
<text x="780.0" y="227.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">Falla al confirmar</text>
<text x="780.0" y="244.0" text-anchor="middle" font-size="12" fill="#1d1d1b">sin compensación: se reintenta</text>
<text x="780.0" y="261.0" text-anchor="middle" font-size="12" fill="#1d1d1b">hacia adelante (reentrega)</text>
<rect x="915" y="205" width="200" height="160" rx="10" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
<text x="1015.0" y="238.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">Mensaje duplicado</text>
<text x="1015.0" y="255.0" text-anchor="middle" font-size="12" fill="#1d1d1b">o reentregado</text>
<text x="1015.0" y="272.0" text-anchor="middle" font-size="12" fill="#1d1d1b"></text>
<text x="1015.0" y="289.0" text-anchor="middle" font-size="12" fill="#1d1d1b">Pedido ya Confirmado:</text>
<text x="1015.0" y="306.0" text-anchor="middle" font-size="12" fill="#1d1d1b">solo se hace el ack.</text>
<text x="1015.0" y="323.0" text-anchor="middle" font-size="12" fill="#1d1d1b">Pedido ya Rechazado:</text>
<text x="1015.0" y="340.0" text-anchor="middle" font-size="12" fill="#1d1d1b">se repite la liberación.</text>
<rect x="20" y="405" width="1110" height="155" rx="12" fill="#f7f7f5" stroke="#c9c9c0" stroke-width="1.2"/>
<text x="32" y="424" font-size="12" font-weight="700" fill="#5b5b55">Compensación: liberar el stock reservado (StockNoDisponible, PagoFallido y PagoNoDisponible)</text>
<rect x="40" y="445" width="330" height="95" rx="10" fill="#fdecee" stroke="#c8102e" stroke-width="1.5"/>
<text x="205.0" y="479.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">Liberar la reserva</text>
<text x="205.0" y="496.5" text-anchor="middle" font-size="12" fill="#1d1d1b">idempotente: repetirla no devuelve</text>
<text x="205.0" y="513.5" text-anchor="middle" font-size="12" fill="#1d1d1b">el stock dos veces</text>
<rect x="405" y="445" width="330" height="95" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="1.5"/>
<text x="570.0" y="479.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">Orden de los pasos</text>
<text x="570.0" y="496.5" text-anchor="middle" font-size="12" fill="#1d1d1b">primero el pedido queda Rechazado,</text>
<text x="570.0" y="513.5" text-anchor="middle" font-size="12" fill="#1d1d1b">después se libera el stock</text>
<rect x="770" y="445" width="340" height="95" rx="10" fill="#fdecee" stroke="#c8102e" stroke-width="1.5"/>
<text x="940.0" y="479.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1d1b">Si la liberación falla</text>
<text x="940.0" y="496.5" text-anchor="middle" font-size="12" fill="#1d1d1b">pausa de 10 s y reject con requeue; tras 5</text>
<text x="940.0" y="513.5" text-anchor="middle" font-size="12" fill="#1d1d1b">entregas el mensaje va a orders.dead</text>
<path d="M340,365 V445" fill="none" stroke="#b36b00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<path d="M560,365 V445" fill="none" stroke="#b36b00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<text x="348" y="399" text-anchor="start" font-size="11" fill="#8a4a00">libera stock</text>
<text x="568" y="399" text-anchor="start" font-size="11" fill="#8a4a00">libera stock</text>
<path d="M370,492 H405" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#af)"/>
<path d="M735,492 H770" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#af)"/>
<path d="M40,586 H80" stroke="#333" stroke-width="1.6" marker-end="url(#af)"/>
<text x="88" y="590" text-anchor="start" font-size="12" fill="#333">Camino normal</text>
<path d="M240,586 H280" stroke="#b36b00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<text x="288" y="590" text-anchor="start" font-size="12" fill="#333">Falla o compensación</text>
</svg>
